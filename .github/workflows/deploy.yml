name: Deploy to AWS ECR and ECS

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy to ECR
    runs-on: ubuntu-latest

    steps:
    # Checkout the code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Login to AWS ECR
    - name: Authenticate with AWS ECR
      run: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    # Build Docker Image
    - name: Build Docker Image
      run: docker build -t ${{ secrets.ECR_REPOSITORY }} .

    # Tag Docker Image
    - name: Tag Docker Image
      run: docker tag ${{ secrets.ECR_REPOSITORY }}:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

    # Push Docker Image to ECR
    - name: Push Docker Image to AWS ECR
      run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

    # Update ECS Task Definition and Deploy
    - name: Deploy to ECS
      run: |
        aws ecs update-service --cluster ecs-demo-cluster \
          --service ecs-demo-service \
          --force-new-deployment